[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-maintainer"
version = "0.1.0"
description = "Evidence-driven, approval-gated Python repository maintenance"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
enigma = "enigma.cli:main"

[tool.setuptools.packages.find]
include = ["enigma*"]
