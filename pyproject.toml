[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enigma"
version = "0.1.0"
description = "Evidence-driven repository maintenance agent skill — Hacktoberfest 2026 Track 2"
readme = "README.md"

license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "jsonschema>=4.21,<5",
    "requests>=2.32,<3",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]

[project.scripts]
enigma = "enigma.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["enigma"]
